# Captures the store screenshots on iOS
macos:
  xcode: 26.3.0
resource_class: m4pro.medium
environment:
  FASTLANE_SKIP_UPDATE_CHECK: true
  TOTAL_CPUS: 6
  IPHONE_SIMULATOR: iPhone 17 Pro Max
shell: /bin/bash --login -o pipefail
steps:
  - checkout
  - restore_yarn_cache
  - restore_ruby_cache:
      directory: ios
  - restore_cocoa_pods_cache
  - install_maestro
  - run:
      name: Boot iPhone simulator
      command: |
        xcrun simctl boot "$IPHONE_SIMULATOR" || true
        xcrun simctl bootstatus "$IPHONE_SIMULATOR" -b
  - run:
      name: Build and install release app on iPhone simulator
      command: yarn ios:production --simulator "$IPHONE_SIMULATOR"
  - run:
      name: Capture iPhone screenshots
      command: yarn screenshots:ios
  - verify_screenshots:
      directory: ios/fastlane/screenshots/de-DE
      pattern: iphone_*.png
  - run:
      name: Boot iPad simulator
      command: |
        xcrun simctl shutdown all
        ipad_simulator=$(xcrun simctl list devices available | grep -m1 -o 'iPad Pro 13-inch ([^)]*)')
        if [ -z "$ipad_simulator" ]; then
          echo "No iPad Pro 13-inch simulator available."
          exit 1
        fi
        echo "export IPAD_SIMULATOR='$ipad_simulator'" >> "$BASH_ENV"
        xcrun simctl boot "$ipad_simulator" || true
        xcrun simctl bootstatus "$ipad_simulator" -b
  - run:
      name: Build and install release app on iPad simulator
      command: yarn ios:production --simulator "$IPAD_SIMULATOR"
  - run:
      name: Capture iPad screenshots
      command: yarn screenshots:ios
  - verify_screenshots:
      directory: ios/fastlane/screenshots/de-DE
      pattern: ipad_*.png
  - persist_to_workspace:
      root: .
      paths:
        - ios/fastlane/screenshots/de-DE/*.png
  - notify
